<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hankimsoft</title>
<meta name="description" content="hankimsoft가 만드는 모바일 앱 — 장보기 계산기 담은(Brim), 자산배분 리밸런싱 트리밸(Treebal).">
<meta name="google-site-verification" content="VJ95UxA5i5IiW1hQxM98G9uI-Lwynx4EgOh6faAXhok">
<link rel="canonical" href="https://hankimsoft.github.io/">
<link rel="icon" href="/brim/assets/icon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="hankimsoft">
<meta property="og:description" content="hankimsoft가 만드는 모바일 앱 — 담은, 트리밸.">
<meta property="og:url" content="https://hankimsoft.github.io/">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F1F1EE; --ink:#16181A; --ink2:#5D6166;
    --wall:#173A2C; --wall2:#21523D; --glass:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.34);
    --green:#3E9E6E; --blue:#4F7CFF;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.6;
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}
  a{color:inherit}

  .layout{max-width:1180px; margin:0 auto; min-height:100vh; padding:48px clamp(16px,4vw,48px);
          display:grid; grid-template-columns:1fr auto; gap:clamp(32px,6vw,96px); align-items:center}

  .side .brand{font-weight:800; font-size:17px; letter-spacing:-.3px}
  .side h1{margin:28px 0 0; font-size:clamp(36px,4.6vw,60px); line-height:1.12; letter-spacing:-.045em; font-weight:800}
  .side p{margin:22px 0 0; font-size:17px; color:var(--ink2); max-width:32ch}
  .side .hint{margin-top:36px; display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink2)}
  .side .hint i{width:26px; height:1px; background:currentColor}
  .side .mail{display:inline-block; margin-top:40px; font-weight:700; font-size:15px; text-decoration:none; border-bottom:2px solid var(--ink)}

  /* ---------- 폰 ---------- */
  .phone{width:390px; height:800px; padding:12px; border-radius:62px; background:#0E0F10;
         box-shadow:0 0 0 2px #2B2D30, 0 40px 80px rgba(20,24,22,.28), 0 8px 18px rgba(20,24,22,.18)}
  .screen{position:relative; height:100%; border-radius:50px; overflow:hidden; color:#fff;
          background:
            radial-gradient(60% 40% at 85% 12%, #2E6B50 0, transparent 70%),
            radial-gradient(70% 50% at 10% 90%, #102A20 0, transparent 70%),
            linear-gradient(170deg, var(--wall2), var(--wall));
          padding:16px 22px 0; display:flex; flex-direction:column}
  .status{display:flex; justify-content:space-between; align-items:center; height:38px; padding:0 14px; font-size:15px; font-weight:700}
  .island{position:absolute; left:50%; top:14px; width:118px; height:34px; margin-left:-59px; border-radius:20px; background:#000}
  .status svg{height:12px; fill:#fff}

  .glass{background:var(--glass); border:1px solid var(--glass-line); border-radius:24px;
         -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.18)}

  .home{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:20px 12px; align-content:start; padding-top:18px}
  .w-wide{grid-column:span 4; padding:16px 18px; text-decoration:none; display:block}
  .w-sq{grid-column:span 2; aspect-ratio:1; padding:14px 16px; text-decoration:none; display:flex; flex-direction:column}
  .w-label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; opacity:.85}
  .w-label img{width:16px; height:16px; border-radius:24%}
  .big{font-size:30px; font-weight:800; letter-spacing:-.04em; margin-top:6px; line-height:1.1}
  .meter{height:8px; border-radius:6px; background:rgba(255,255,255,.18); margin-top:12px; overflow:hidden}
  .meter i{display:block; height:100%; width:81%; background:#7CD3A4; border-radius:6px}
  .small{font-size:12.5px; opacity:.8; margin-top:6px}
  .alloc{display:flex; height:10px; border-radius:6px; overflow:hidden; margin-top:auto}
  .alloc i{display:block}
  .w-sq .big{font-size:22px}

  .icon{display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; font-size:11.5px; font-weight:600}
  .icon .img{width:62px; height:62px; border-radius:24%; overflow:hidden; display:grid; place-items:center;
             box-shadow:0 4px 12px rgba(0,0,0,.25); transition:transform .15s ease}
  .icon:hover .img{transform:scale(1.07)}
  .icon .img img{width:100%; height:100%; display:block}
  .icon svg{width:30px; height:30px; fill:#fff}

  .dots{display:flex; justify-content:center; gap:7px; padding:8px 0 12px}
  .dots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4)}
  .dots i:first-child{background:#fff}
  .dock{margin:0 -8px 14px; padding:14px 18px; border-radius:36px; display:flex; justify-content:space-around}
  .dock .icon span:last-child{display:none}
  .bar{width:136px; height:5px; border-radius:3px; background:#fff; margin:0 auto 8px; opacity:.9}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr; padding:0; gap:0; min-height:0}
    .side{padding:36px 20px 28px}
    .side .hint{display:none}
    .side .mail{margin-top:24px}
    .phone{width:auto; height:auto; padding:0; border-radius:0; box-shadow:none; background:none}
    .screen{border-radius:28px 28px 0 0; padding:10px 18px 0; min-height:720px}
    .status,.island{display:none}
  }
</style>
</head>
<body>
<div class="layout">

  <section class="side">
    <div class="brand">hankimsoft</div>
    <h1>매일 여는<br>앱을 만듭니다</h1>
    <p>장보기, 자산 관리처럼 폰 첫 화면에 둘 만한 앱. iOS와 Android에서 씁니다.</p>
    <div class="hint"><i></i>아이콘을 눌러 보세요</div>
    <a class="mail" href="mailto:hankimsoft@gmail.com">hankimsoft@gmail.com</a>
  </section>

  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span id="t">9:41</span>
        <svg viewBox="0 0 66 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="38" y="1" width="24" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="40" y="3" width="18" height="6" rx="1.5"/><rect x="63" y="4" width="2" height="4" rx="1"/></svg>

          <div class="meter"><i></i></div>
          <div class="small">예산까지 5,700원 남았어요</div>

        <a class="glass w-sq" href="/treebal/">
          <div class="w-label"><img src="/assets/treebal-icon.png" alt="">트리밸</div>
          <div class="big">비중 맞추기</div>

          <div class="alloc"><i style="width:55%;background:#7FA2FF"></i><i style="width:30%;background:#C9D7FF"></i><i style="width:10%;background:#E5B53A"></i><i style="width:5%;background:#F08A3C"></i></div>
        </a>

        <div class="w-sq" style="display:grid;grid-template-columns:1fr 1fr;gap:16px 8px;align-content:center;padding:0;aspect-ratio:auto">
          <a class="icon" href="/brim/"><span class="img"><img src="/assets/brim-icon.svg" alt=""></span><span>담은</span></a>
          <a class="icon" href="/treebal/"><span class="img"><img src="/assets/treebal-icon.png" alt=""></span><span>트리밸</span></a>
          <a class="icon" href="https://apps.apple.com/app/id6799173101" target="_blank" rel="noopener"><span class="img" style="background:linear-gradient(#1AC8FC,#1C7CF4)"><svg viewBox="0 0 24 24"><path d="M11 4a1 1 0 1 1 2 0v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V4zM5 19a1 1 0 1 1 0-2h14a1 1 0 1 1 0 2H5z"/></svg></span><span>App Store</span></a>
          <a class="icon" href="mailto:hankimsoft@gmail.com"><span class="img" style="background:linear-gradient(#5AB0FF,#2A7BEA)"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11zm2.2-.3L12 11.4l6.8-5.2a1 1 0 0 0-.3-.2h-13a1 1 0 0 0-.3.2zM19 8.3l-6.4 4.9a1 1 0 0 1-1.2 0L5 8.3v9.2c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V8.3z"/></svg></span><span>문의</span></a>
        </div>
        <a class="icon" href="https://play.google.com/store/apps/details?id=com.hankimsoft.brim" target="_blank" rel="noopener"><span class="img" style="background:#fff"><svg viewBox="0 0 24 24" style="fill:#16181A"><path d="M5 3.5v17c0 .4.4.6.7.4l14-8.5a.5.5 0 0 0 0-.8l-14-8.5c-.3-.2-.7 0-.7.4z"/></svg></span><span>Play</span></a>
        <a class="icon" href="/brim/support/"><span class="img" style="background:#ECEFEC"><svg viewBox="0 0 24 24" style="fill:#3E9E6E"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 15.5a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm1.3-5.1c-.6.3-.8.6-.8 1.1v.3h-2v-.4c0-1.2.6-2 1.6-2.5.7-.4 1-.7 1-1.2 0-.6-.5-1-1.2-1s-1.2.4-1.3 1.1H8.6C8.7 7.9 10.1 6.8 12 6.8c1.9 0 3.2 1.1 3.2 2.6 0 1.2-.7 2.1-1.9 3z"/></svg></span><span>도움말</span></a>
        <a class="icon" href="/brim/privacy/"><span class="img" style="background:#ECEFEC"><svg viewBox="0 0 24 24" style="fill:#5D6166"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3zm0 2.1L6 6.4V11c0 4 2.6 7.6 6 8.9 3.4-1.3 6-4.9 6-8.9V6.4l-6-2.3z"/></svg></span><span>방침</span></a>
      </div>

      <div class="dots" aria-hidden="true"><i></i><i></i></div>
      <nav class="glass dock" aria-label="앱">
        <a class="icon" href="/brim/"><span class="img"><img src="/assets/brim-icon.svg" alt="담은"></span><span>담은</span></a>
        <a class="icon" href="/treebal/"><span class="img"><img src="/assets/treebal-icon.png" alt="트리밸"></span><span>트리밸</span></a>
        <a class="icon" href="mailto:hankimsoft@gmail.com"><span class="img" style="background:linear-gradient(#5AB0FF,#2A7BEA)"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11zm2.2-.3L12 11.4l6.8-5.2a1 1 0 0 0-.3-.2h-13a1 1 0 0 0-.3.2zM19 8.3l-6.4 4.9a1 1 0 0 1-1.2 0L5 8.3v9.2c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V8.3z"/></svg></span><span>문의</span></a>
      </nav>
      <div class="bar"></div>
    </div>
  </div>

</div>
<script>
  // 상태 표시줄에 지금 시각
  (function(){var d=new Date();document.getElementById('t').textContent=d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()})();
</script>
</body>
</html>
