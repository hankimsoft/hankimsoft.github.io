<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hankimsoft</title>
<meta name="description" content="hankimsoft가 만드는 모바일 앱 — 장보기 계산기 담은(Brim), 자산배분 리밸런싱 트리밸(Treebal).">
<meta name="google-site-verification" content="VJ95UxA5i5IiW1hQxM98G9uI-Lwynx4EgOh6faAXhok">
<link rel="canonical" href="https://hankimsoft.github.io/">
<link rel="icon" href="/brim/assets/icon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="hankimsoft">
<meta property="og:description" content="hankimsoft가 만드는 모바일 앱 — 담은, 트리밸.">
<meta property="og:url" content="https://hankimsoft.github.io/">
<link rel="stylesheet" href="/assets/fonts/pretendard/pretendard.css">
<style>
  :root{
    --bg:#F1F1EE; --ink:#16181A; --ink2:#5D6166;
    --wall:#173A2C; --wall2:#21523D; --glass:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.34);
    --green:#3E9E6E; --blue:#4F7CFF;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); word-break:keep-all; line-height:1.6;
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}
  a{color:inherit}

  .layout{max-width:1180px; margin:0 auto; min-height:100vh; padding:48px clamp(16px,4vw,48px);
          display:grid; grid-template-columns:1fr auto; gap:clamp(32px,6vw,96px); align-items:center}

  .side .brand{font-weight:800; font-size:17px; letter-spacing:-.3px}
  .side h1{margin:28px 0 0; font-size:clamp(36px,4.6vw,60px); line-height:1.12; letter-spacing:-.045em; font-weight:800}
  .side p{margin:22px 0 0; font-size:17px; color:var(--ink2); max-width:32ch}
  .side .mail{display:inline-flex; gap:8px; margin-top:32px; font-size:14px; color:var(--ink2); text-decoration:none}
  .side .mail b{color:var(--ink); border-bottom:1.5px solid var(--ink)}

  /* 앱 목록 — 무엇을 누르면 되는지 바로 보이게. 줄에 올리면 폰 속 같은 앱 위젯이 같이 밝아진다 */
  .apps{margin-top:36px; display:grid; gap:10px; max-width:440px}
  .app{display:flex; align-items:center; gap:14px; padding:14px 18px 14px 14px; border-radius:20px; background:#fff; text-decoration:none;
       box-shadow:0 1px 0 rgba(22,24,26,.05), 0 6px 18px rgba(22,24,26,.05); transition:transform .18s ease, box-shadow .18s ease}
  .app img{width:52px; height:52px; border-radius:24%; flex:none}
  .app div{flex:1; min-width:0}
  .app b{font-size:17px; letter-spacing:-.3px}
  .app small{display:block; font-size:13.5px; color:var(--ink2); margin-top:1px}
  .app em{font-style:normal; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:99px; margin-left:6px; vertical-align:2px}
  .app em.live{background:#E4F0E9; color:#2E7A56} .app em.soon{background:#E8EEFF; color:#2F55C9}
  .app .go{flex:none; font-style:normal; font-size:20px; color:var(--ink2); transition:transform .18s ease}
  .app:hover,.app.lit{transform:translateY(-2px); box-shadow:0 1px 0 rgba(22,24,26,.05), 0 14px 30px rgba(22,24,26,.10)}
  .app:hover .go,.app.lit .go{transform:translateX(4px); color:var(--ink)}
  .app:focus-visible{outline:2px solid var(--green); outline-offset:3px}

  /* ---------- 폰 ---------- */
  .phone{width:390px; height:800px; padding:12px; border-radius:62px; background:#0E0F10;
         box-shadow:0 0 0 2px #2B2D30, 0 40px 80px rgba(20,24,22,.28), 0 8px 18px rgba(20,24,22,.18)}
  .screen{position:relative; height:100%; border-radius:50px; overflow:hidden; color:#fff;
          background:
            radial-gradient(60% 40% at 85% 12%, #2E6B50 0, transparent 70%),
            radial-gradient(70% 50% at 10% 90%, #102A20 0, transparent 70%),
            linear-gradient(170deg, var(--wall2), var(--wall));
          padding:16px 22px 0; display:flex; flex-direction:column}
  .status{display:flex; justify-content:space-between; align-items:center; height:38px; padding:0 14px; font-size:15px; font-weight:700}
  .island{position:absolute; left:50%; top:14px; width:118px; height:34px; margin-left:-59px; border-radius:20px; background:#000}
  .status svg{height:12px; fill:#fff}

  .glass{background:var(--glass); border:1px solid var(--glass-line); border-radius:24px;
         -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.18)}

  .home{flex:1; display:flex; flex-direction:column; gap:14px; padding-top:18px}
  /* 위젯 = 링크. 오른쪽 위 「열기 ›」로 누르는 것임을 알린다 */
  .w{position:relative; display:block; padding:16px 18px; text-decoration:none; transition:transform .18s ease, box-shadow .18s ease, background .18s ease}
  .w:hover,.w.lit{transform:translateY(-2px); background:rgba(255,255,255,.24); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 2px rgba(255,255,255,.55), 0 14px 30px rgba(0,0,0,.25)}
  .w:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .w-label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700}
  .w-label span{opacity:.85}
  .w-label .open{margin-left:auto; opacity:1; font-size:11.5px; padding:3px 9px; border-radius:99px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35)}
  .w-label .soon{background:rgba(79,124,255,.35)}
  .get{display:flex; gap:8px; margin-top:10px}
  .get a{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:44px; border-radius:14px; text-decoration:none; font-size:14px; font-weight:700;
         background:rgba(255,255,255,.92); color:#16181A; transition:transform .15s ease}
  .get a:hover{transform:translateY(-1px)}
  .get a + a{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.4)}
  .get svg{width:16px; height:16px; fill:currentColor}
  /* 처음 온 사람에게 — 담은 위젯이 숨 쉬듯 빛나고 「눌러 보세요」. 아무 데나 올리거나 누르면 사라진다 */
  .tip{position:absolute; right:14px; top:-14px; transform:translateY(-100%); background:#fff; color:#16181A; font-size:12.5px; font-weight:800;
       padding:6px 11px; border-radius:11px; box-shadow:0 8px 20px rgba(0,0,0,.25); pointer-events:none; transition:opacity .3s ease}
  .tip::after{content:''; position:absolute; right:22px; bottom:-5px; width:10px; height:10px; background:#fff; transform:rotate(45deg); border-radius:2px}
  .w.pulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 0 rgba(255,255,255,.0), 0 8px 24px rgba(0,0,0,.18)}
                   50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 6px rgba(255,255,255,.22), 0 8px 24px rgba(0,0,0,.18)}}
  .seen .tip{opacity:0} .seen .w.pulse{animation:none}
  @media (prefers-reduced-motion:reduce){ .w.pulse{animation:none} .w,.app,.app .go{transition:none} }
  .w-label img{width:16px; height:16px; border-radius:24%}
  .big{font-size:30px; font-weight:800; letter-spacing:-.04em; margin-top:6px; line-height:1.1}
  .meter{height:8px; border-radius:6px; background:rgba(255,255,255,.18); margin-top:12px; overflow:hidden}
  .meter i{display:block; height:100%; width:81%; background:#7CD3A4; border-radius:6px}
  .small{font-size:12.5px; opacity:.8; margin-top:6px}
  .alloc{display:flex; height:10px; border-radius:6px; overflow:hidden; margin-top:auto}
  .alloc i{display:block}
  .w-tb .big{font-size:22px}
  .w-tb .alloc{margin-top:12px}

  .icon{display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; font-size:11.5px; font-weight:600}
  .icon .img{width:62px; height:62px; border-radius:24%; overflow:hidden; display:grid; place-items:center;
             box-shadow:0 4px 12px rgba(0,0,0,.25); transition:transform .15s ease}
  .icon:hover .img{transform:scale(1.07)}
  .icon .img img{width:100%; height:100%; display:block}
  .icon svg{width:30px; height:30px; fill:#fff}

  .dock{margin:12px -8px 14px; padding:14px 18px; border-radius:36px; display:flex; justify-content:space-around}
  .dock .icon span:last-child{display:none}
  .bar{width:136px; height:5px; border-radius:3px; background:#fff; margin:0 auto 8px; opacity:.9}

  @media (max-width:860px){
    .layout{grid-template-columns:minmax(0,1fr); padding:0; gap:0; min-height:0}
    .side{padding:36px 20px 24px}
    /* 좁은 화면에선 초록 화면의 위젯이 곧 앱 목록 — 같은 목록을 두 번 보여 주지 않는다 */
    .apps{display:none}
    .side .mail{margin-top:20px}
    .phone{width:auto; height:auto; padding:0 12px 24px; border-radius:0; box-shadow:none; background:none}
    /* 위쪽 여백은 「눌러 보세요」 말풍선 자리 */
    .screen{border-radius:28px; padding:54px 16px 0; min-height:0}
    .status,.island,.dock,.bar{display:none}
    .home{padding:0 0 18px}
    .tip{right:10px}
  }
</style>
</head>
<body>
<div class="layout">

  <section class="side">
    <div class="brand">hankimsoft</div>
    <h1>매일 여는<br>앱을 만듭니다</h1>
    <p>장보기, 자산 관리처럼 폰 첫 화면에 둘 만한 앱. iOS와 Android에서 씁니다.</p>
    <nav class="apps" aria-label="앱">
      <a class="app" data-app="brim" href="/brim/"><img src="/assets/brim-icon.svg" alt=""><div><b>담은</b><em class="live">출시</em><small>장보기 계산기 · 예산에 딱 맞게 담아요</small></div><i class="go" aria-hidden="true">→</i></a>
      <a class="app" data-app="treebal" href="/treebal/"><img src="/assets/treebal-icon.png" alt=""><div><b>트리밸</b><em class="soon">곧 출시</em><small>자산 비중 관리 · 목표 비중으로 리밸런싱</small></div><i class="go" aria-hidden="true">→</i></a>
    </nav>
    <a class="mail" href="mailto:hankimsoft@gmail.com">문의 <b>hankimsoft@gmail.com</b></a>
  </section>

  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span id="t">9:41</span>
        <svg viewBox="0 0 66 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="38" y="1" width="24" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="40" y="3" width="18" height="6" rx="1.5"/><rect x="63" y="4" width="2" height="4" rx="1"/></svg>
      </div>

      <div class="home">
        <a class="glass w pulse" data-app="brim" href="/brim/">
          <span class="tip" aria-hidden="true">눌러 보세요</span>
          <div class="w-label"><img src="/assets/brim-icon.svg" alt=""><span>담은 · 장보기 계산기</span><span class="open">열기 ›</span></div>
          <div class="big">24,300원</div>
          <div class="meter"><i></i></div>
          <div class="small">예산까지 5,700원 남았어요</div>
        </a>

        <a class="glass w w-tb" data-app="treebal" href="/treebal/">
          <div class="w-label"><img src="/assets/treebal-icon.png" alt=""><span>트리밸 · 자산 비중 관리</span><span class="open soon">곧 출시</span></div>
          <div class="big">비중 맞추기</div>
          <div class="small">채권으로 168.4만 원</div>
          <div class="alloc"><i style="width:55%;background:#7FA2FF"></i><i style="width:30%;background:#C9D7FF"></i><i style="width:10%;background:#E5B53A"></i><i style="width:5%;background:#F08A3C"></i></div>
        </a>

        <div class="glass w" data-app="brim">
          <div class="w-label"><img src="/assets/brim-icon.svg" alt=""><span>담은 받기 · 무료</span></div>
          <div class="get">
            <a href="https://apps.apple.com/app/id6799173101" target="_blank" rel="noopener" aria-label="담은 iPhone 앱 받기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a1 1 0 1 1 2 0v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V4zM5 19a1 1 0 1 1 0-2h14a1 1 0 1 1 0 2H5z"/></svg>iPhone</a>
            <a href="https://play.google.com/store/apps/details?id=com.hankimsoft.brim" target="_blank" rel="noopener" aria-label="담은 Android 앱 받기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a1 1 0 1 1 2 0v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V4zM5 19a1 1 0 1 1 0-2h14a1 1 0 1 1 0 2H5z"/></svg>Android</a>
          </div>
        </div>
      </div>

      <nav class="glass dock" aria-label="앱">
        <a class="icon" href="/brim/"><span class="img"><img src="/assets/brim-icon.svg" alt="담은"></span><span>담은</span></a>
        <a class="icon" href="/treebal/"><span class="img"><img src="/assets/treebal-icon.png" alt="트리밸"></span><span>트리밸</span></a>
        <a class="icon" href="mailto:hankimsoft@gmail.com"><span class="img" style="background:linear-gradient(#5AB0FF,#2A7BEA)"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11zm2.2-.3L12 11.4l6.8-5.2a1 1 0 0 0-.3-.2h-13a1 1 0 0 0-.3.2zM19 8.3l-6.4 4.9a1 1 0 0 1-1.2 0L5 8.3v9.2c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V8.3z"/></svg></span><span>문의</span></a>
      </nav>
      <div class="bar"></div>
    </div>
  </div>

</div>
<script>
  // 상태 표시줄에 지금 시각
  (function(){var d=new Date();document.getElementById('t').textContent=d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()})();
  // 왼쪽 목록 줄 ↔ 폰 속 위젯을 같이 밝힌다. 한 번이라도 올리거나 누르면 「눌러 보세요」는 거둔다.
  (function(){
    var all=[].slice.call(document.querySelectorAll('[data-app]'));
    function lit(app,on){all.forEach(function(e){if(e.getAttribute('data-app')===app)e.classList.toggle('lit',on)})}
    function seen(){document.body.classList.add('seen')}
    all.forEach(function(e){var app=e.getAttribute('data-app');
      e.addEventListener('mouseenter',function(){lit(app,true);seen()});
      e.addEventListener('mouseleave',function(){lit(app,false)});
      e.addEventListener('focusin',function(){lit(app,true);seen()});
      e.addEventListener('focusout',function(){lit(app,false)});
    });
    document.addEventListener('pointerdown',seen,{once:true});
  })();
</script>
</body>
</html>
