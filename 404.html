<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — hankimsoft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brim/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/pretendard/pretendard.css">
<script>/* 첫 페인트 전 언어 확정 — 기본 영어, 브라우저가 한국어면 한국어, 사용자 선택이 최우선 */
(function(){var l=null;try{l=localStorage.getItem("brim-lang")}catch(e){}if(l!=="ko"&&l!=="en"){var a=navigator.languages||[navigator.language||""];l="en";for(var i=0;i<a.length;i++){var x=String(a[i]).toLowerCase();if(x.indexOf("ko")===0){l="ko";break}if(x.indexOf("en")===0){l="en";break}}}var d=document.documentElement;d.setAttribute("data-lang",l);d.lang=l})();</script>
<style>
  :root{color-scheme:light; --bg:#F1F1EE; --ink:#16181A; --ink2:#5D6166; --ink3:#8E9297; --line:#DEDED8}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); line-height:1.6;
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
       word-break:keep-all; overflow-wrap:anywhere}
  html[data-lang="ko"] .l-en, html[data-lang="en"] .l-ko{display:none !important}
  .top{max-width:1180px; width:100%; margin:0 auto; padding:0 clamp(16px,4vw,48px); height:58px; display:flex; align-items:center}
  .back{display:flex; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--ink3); text-decoration:none}
  .back:hover{color:var(--ink)}
  .back svg{width:18px; height:18px}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px 80px}
  /* 홈 화면에 아직 없는 앱 — 메인의 루티 자리와 같은 점선 아이콘 */
  .ghost{width:88px; height:88px; border-radius:24%; border:2.5px dashed #B9BCC0; display:grid; place-items:center;
         font-size:20px; font-weight:800; color:var(--ink3); letter-spacing:.02em}
  .lbl{margin-top:10px; font-size:12.5px; font-weight:600; color:var(--ink3)}
  h1{margin:32px 0 0; font-size:clamp(28px,4vw,40px); line-height:1.2; letter-spacing:-.04em; font-weight:800}
  p{margin:14px 0 0; font-size:16px; color:var(--ink2); max-width:40ch}
  .links{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:30px}
  .btn{display:inline-flex; align-items:center; height:46px; padding:0 18px; border-radius:12px; font-size:14.5px; font-weight:700;
       text-decoration:none; background:#fff; color:var(--ink)}
  .btn.dark{background:var(--ink); color:#fff}
  .btn:hover{opacity:.85}
  a:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
  footer{max-width:1180px; width:100%; margin:0 auto; padding:24px clamp(16px,4vw,48px) 40px; border-top:1px solid var(--line); font-size:13px; color:var(--ink3)}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>hankimsoft</a>
</header>

<main>
  <div class="ghost" aria-hidden="true">404</div>
  <div class="lbl" aria-hidden="true"><span class="l-ko">없는 화면</span><span class="l-en">Not here</span></div>
  <h1><span class="l-ko">페이지를 찾을 수 없습니다</span><span class="l-en">Page not found</span></h1>
  <p>
    <span class="l-ko">주소가 바뀌었거나 삭제된 페이지입니다. 아래에서 원하시는 곳으로 가실 수 있습니다.</span>
    <span class="l-en">The address may have changed, or the page may have been removed. You can pick where to go from here.</span>
  </p>
  <div class="links">
    <a class="btn dark" href="/"><span class="l-ko">홈으로</span><span class="l-en">Home</span></a>
    <a class="btn" href="/brim/"><span class="l-ko">담은 소개</span><span class="l-en">About Brim</span></a>
  </div>
</main>

<footer>© 2026 hankimsoft</footer>

</body>
</html>
