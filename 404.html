<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 - hankimsoft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/favicon/hk-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/favicon/hk-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<script>/* 첫 페인트 전 언어 확정 — 기본 영어, 브라우저가 한국어면 한국어, 사용자 선택이 최우선 (담은 영어 페이지에서 잘못 들어온 사람도 읽도록) */
(function(){var l=null;try{l=localStorage.getItem("brim-lang")}catch(e){}if(l!=="ko"&&l!=="en"){var a=navigator.languages||[navigator.language||""];l="en";for(var i=0;i<a.length;i++){var x=String(a[i]).toLowerCase();if(x.indexOf("ko")===0){l="ko";break}if(x.indexOf("en")===0){l="en";break}}}var d=document.documentElement;d.setAttribute("data-lang",l);d.lang=l;if(l==="en")document.title="Page not found - hankimsoft"})();</script>
<style>
  /* 메인(/)과 같은 토큰 · 머리글 · 바닥글 */
  :root{color-scheme:light}
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--color-bg); color:var(--color-ink);
       font-family:var(--font-sans); font-size:var(--fs-body); line-height:var(--lh-body); word-break:keep-all}
  html[data-lang="ko"] .l-en, html[data-lang="en"] .l-ko{display:none !important}
  a{color:inherit; text-decoration:none}
  a:focus-visible{outline:2px solid var(--color-ink); outline-offset:4px; border-radius:10px}
  .wrap{max-width:var(--container); margin:0 auto; padding:0 var(--gutter); width:100%}

  .gnb{height:76px; display:flex; align-items:center}
  .logo{font-size:18px; font-weight:var(--fw-heavy); letter-spacing:-.04em}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:var(--space-10) var(--gutter) var(--space-20)}
  /* 메인 첫 화면의 점선 「다음 앱」 칸과 같은 모양 */
  .ghost{width:112px; height:112px; border-radius:var(--radius-icon); border:2px dashed var(--color-line-strong); display:grid; place-items:center;
         transform:rotate(-4deg); font-size:26px; font-weight:var(--fw-black); letter-spacing:-.04em; color:var(--color-ink-2)}
  h1{margin:var(--space-10) 0 0; font-size:clamp(32px,4.5vw,56px); line-height:1.15; letter-spacing:var(--ls-display); font-weight:var(--fw-black)}
  p{margin:var(--space-4) 0 0; color:var(--color-ink-2); max-width:40ch}
  .links{display:flex; flex-wrap:wrap; justify-content:center; gap:var(--space-2); margin-top:var(--space-8)}
  .btn{display:inline-flex; align-items:center; min-height:48px; padding:0 var(--space-6); border-radius:var(--radius-pill); border:1.5px solid var(--color-ink);
       font-size:var(--fs-ui); font-weight:var(--fw-bold); transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out)}
  .btn.dark{background:var(--color-ink); color:var(--color-inverse-ink)}
  .btn:hover{background:var(--color-ink); color:var(--color-inverse-ink)}
  .btn.dark:hover{opacity:.85}

  .footer{background:var(--color-inverse-bg); color:var(--color-inverse-ink); overflow:hidden}
  .footer a:focus-visible{outline-color:var(--color-inverse-ink)}
  .footer__top{padding-top:var(--space-16); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:var(--space-6)}
  .footer__mail{font-size:clamp(24px,3vw,40px); font-weight:var(--fw-heavy); letter-spacing:-.05em; border-bottom:3px solid currentColor; padding-bottom:6px; line-height:1.2}
  .footer__copy{margin:0; font-size:var(--fs-label); color:var(--color-inverse-ink-2)}
  .footer__ghost{margin-top:var(--space-12); text-align:center; white-space:nowrap; font-size:var(--fs-wordmark); line-height:.78; font-weight:var(--fw-black); letter-spacing:var(--ls-wordmark); color:var(--color-inverse-ghost)}

  @media (max-width:599px){
    .gnb{height:60px}
    .logo{font-size:17px}
    .footer__top{padding-top:48px}
    .footer__mail{border-bottom-width:2px}
  }
</style>
</head>
<body>

<header class="wrap gnb">
  <a class="logo" href="/">hankimsoft</a>
</header>

<main>
  <div class="ghost" aria-hidden="true">404</div>
  <h1><span class="l-ko">페이지를 찾을 수 없습니다</span><span class="l-en">Page not found</span></h1>
  <p>
    <span class="l-ko">주소가 바뀌었거나 삭제된 페이지입니다. 아래에서 원하시는 곳으로 가실 수 있습니다.</span>
    <span class="l-en">The address may have changed, or the page may have been removed. You can pick where to go from here.</span>
  </p>
  <div class="links">
    <a class="btn dark" href="/"><span class="l-ko">홈으로</span><span class="l-en">Home</span></a>
    <a class="btn" href="/brim/"><span class="l-ko">담은 소개</span><span class="l-en">About Brim</span></a>
  </div>
</main>

<footer class="footer"><div class="wrap">
  <div class="footer__top">
    <a href="mailto:hankimsoft@gmail.com" class="footer__mail">hankimsoft@gmail.com</a>
    <p class="footer__copy">© 2026 hankimsoft</p>
  </div>
  <div class="footer__ghost" aria-hidden="true">hankimsoft</div>
</div></footer>

</body>
</html>
